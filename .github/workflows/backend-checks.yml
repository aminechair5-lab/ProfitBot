name: backend-checks
on:
  push:
    branches: [main, feature/web-dashboard-v1]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q app tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check dashboard JavaScript syntax
        run: python -c "from pathlib import Path; import re; s=Path('app/dashboard.html').read_text(); Path('/tmp/dashboard.js').write_text(re.search(r'<script>([\s\S]*?)</script>', s).group(1))" && node --check /tmp/dashboard.js
